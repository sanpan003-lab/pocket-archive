version: '3.8'
services:
  pocket-archive:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pocket-archive
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - ARCHIVE_PATH=/data/archive
      - ATTACHMENTS_PATH=/data/archive/05_Attachments
      - CONFIG_PATH=/data/config/config.json
      - SYNC_SCRIPT_PATH=/data/archive/PocketSync_Project/pocket_sync.py
      - CLAUDE_MODEL=claude-sonnet-5-5
      # Secrets (JWT_SECRET, API keys) come from .env — never put them here
    volumes:
      - /volume1/PocketArchive:/data/archive
      - /volume1/pocket-archive-app/config:/data/config
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
