<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Pocket Archive — offline</title>
  <!-- Shown by the Android app when the server can't be reached (Capacitor server.errorPath) -->
  <style>
    :root { --bg: #0b1120; --card: #111a2e; --text: #f1f5f9; --muted: #94a3b8; --gold: #f59e0b; --border: rgba(245, 158, 11, .2); }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    }
    main {
      width: 100%; max-width: 26rem; text-align: center;
      background: var(--card); border: 1px solid var(--border); border-radius: 1.25rem;
      padding: 2rem 1.5rem;
    }
    .icon {
      width: 4rem; height: 4rem; margin: 0 auto 1.25rem; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: rgba(245, 158, 11, .12); color: var(--gold);
    }
    h1 { font-size: 1.25rem; margin: 0 0 .75rem; }
    p { color: var(--muted); line-height: 1.5; margin: 0 0 1.5rem; font-size: 1rem; }
    button {
      font: inherit; font-weight: 600; font-size: 1rem; color: #111827;
      background: linear-gradient(135deg, #fbbf24, #f59e0b); border: 0; border-radius: .875rem;
      padding: .875rem 2.5rem; min-height: 3rem; cursor: pointer;
    }
    button:disabled { opacity: .6; }
    .status { min-height: 1.5em; margin: 1rem 0 0; font-size: .875rem; }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M5 12.86a10 10 0 0 1 5.17-2.7"/>
        <path d="M19 12.86a10 10 0 0 0-2.01-1.52"/><path d="M2 8.82a15 15 0 0 1 4.18-2.65"/>
        <path d="M22 8.82a15 15 0 0 0-11.29-3.76"/><path d="m2 2 20 20"/>
      </svg>
    </div>
    <h1>Can't reach Pocket Archive</h1>
    <p>The widget and Quick Settings tile still record and will upload when you're back online.</p>
    <button id="retry" type="button">Retry</button>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>
  <script src="server-url.js"></script>
  <script>
    (function () {
      var target = window.PA_SERVER_URL || '/';
      var button = document.getElementById('retry');
      var status = document.getElementById('status');
      function retry() {
        button.disabled = true;
        status.textContent = 'Connecting…';
        window.location.replace(target);
        setTimeout(function () { button.disabled = false; status.textContent = ''; }, 8000);
      }
      button.addEventListener('click', retry);
      // Back online → try again on our own
      window.addEventListener('online', retry);
    })();
  </script>
</body>
</html>
