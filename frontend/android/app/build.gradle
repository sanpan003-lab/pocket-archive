apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// Release signing: credentials live in android/keystore.properties (gitignored),
// the keystore itself outside the repo. Without them, release builds are unsigned.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

// Server for native code (widget/recorder) before the app has configured it: ../.env.android
def envAndroid = rootProject.file('../.env.android')
def apiBase = ''
if (envAndroid.exists()) {
    envAndroid.eachLine { line ->
        def m = line =~ /^\s*VITE_API_BASE_URL\s*=\s*(.*?)\s*$/
        if (m) apiBase = m[0][1].replaceAll(/^["']|["']$/, '').replaceAll(/\/+$/, '')
    }
}

// App version lives in version.properties. Every release build (assembleRelease,
// bundleRelease, installRelease) bumps versionCode by 1 and the patch of versionName.
def versionFile = file('version.properties')
def versionProps = new Properties()
if (versionFile.exists()) versionFile.withInputStream { versionProps.load(it) }
// (a release build of only the watch app, ":wear:…", doesn't bump the phone version)
def isReleaseBuild = gradle.startParameter.taskNames.any { it ==~ /(?i).*(assemble|bundle|install)Release$/ && !it.startsWith(':wear:') }
if (isReleaseBuild) {
    def code = (versionProps['VERSION_CODE'] ?: '1').toInteger() + 1
    def parts = (versionProps['VERSION_NAME'] ?: '1.0.0').tokenize('.')
    while (parts.size() < 3) parts << '0'
    parts[2] = ((parts[2] as Integer) + 1).toString()
    versionProps['VERSION_CODE'] = code.toString()
    versionProps['VERSION_NAME'] = parts.join('.')
    // A planned release (e.g. a CHANGELOG entry "1.1.0") sets NEXT_VERSION_NAME once; it's used and removed
    if (versionProps['NEXT_VERSION_NAME']) {
        versionProps['VERSION_NAME'] = versionProps['NEXT_VERSION_NAME']
        versionProps.remove('NEXT_VERSION_NAME')
    }
    versionFile.withWriter { versionProps.store(it, 'Bumped automatically by release builds') }
    logger.lifecycle("Pocket Archive release version ${versionProps['VERSION_NAME']} (${versionProps['VERSION_CODE']})")
}

android {
    namespace = "com.sanpan003.pocketarchive"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.sanpan003.pocketarchive"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode((versionProps['VERSION_CODE'] ?: '1').toInteger())
        versionName(versionProps['VERSION_NAME'] ?: '1.0.0')
        buildConfigField "String", "API_BASE", "\"${apiBase}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystoreProps['storeFile']) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        // Device tests: installs NEXT TO the real app (own package, data and launcher name "PA Debug")
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystoreProps['storeFile']) {
                signingConfig signingConfigs.release
            }
        }
    }
    buildFeatures {
        buildConfig = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21)
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    // Quick recorder: uploads + retry until sent
    implementation "androidx.work:work-runtime-ktx:2.12.0"
    implementation "com.squareup.okhttp3:okhttp:5.5.0"
    // Volume down stops a recording (MediaSession + VolumeProviderCompat, also with the screen off)
    implementation "androidx.media:media:1.7.0"
    // Errands: geofences for arrival reminders
    implementation "com.google.android.gms:play-services-location:21.3.0"
    // Galaxy Watch app link (Data Layer)
    implementation "com.google.android.gms:play-services-wearable:20.0.1"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
